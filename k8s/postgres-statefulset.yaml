apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: loantrack
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 20Mi
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        envFrom:
        - configMapRef:
            name: loantrack-config
        - secretRef:
            name: loantrack-secret
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        # Optional init scripts mount (commented if not used)
        # volumeMounts:
        # - name: init-scripts
        #   mountPath: /docker-entrypoint-initdb.d
      # volumes:
      # - name: init-scripts
      #   configMap:
      #     name: postgres-init-scripts
